name: CodeQL
# Static analysis of the JavaScript sources (free for public repositories). Results appear under Security -> Code scanning.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule: [{ cron: '17 3 * * 1' }]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
